<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

#main{
    height: 300px;
    width:  300px;
    background-color: rgb(154, 214, 194);
    border: thin solid rgb(180, 162, 248);
}

@media screen and (min-width:720px) { 

    #main{
        background-color: rgb(154, 163, 247);
        border: thin solid rgb(238, 107, 140);
        border-radius: 30px;
        transform:scale(1.1);
        transform-origin: 0 0;
    }

}



@media screen and (min-width:1040px) {  

    #main{
        background-color: rgb(191, 211, 223);
        border: thin solid rgb(182, 238, 210);
        border-radius: 0 50px;
        transform:scale(1.5);
        transform-origin: 0 0;
        
    }
    
}



</style>

</head>
<body>

    <div id="main">
         <p>hello</p>
    </div>





</body>
</html>
